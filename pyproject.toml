[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ditserve"
version = "0.4.0"
description = "C++ experiment controller with resident Python model adapters and verified Excel results"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
reports = ["openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["workers"]
include = ["ditserve*"]
namespaces = false

[tool.setuptools.data-files]
"share/ditserve/configs" = ["configs/*.json", "configs/*.txt"]
"share/ditserve/configs/studies" = ["configs/studies/*.json"]
"share/ditserve/configs/env" = ["configs/env/*.json"]
"share/ditserve/configs/profiles" = ["configs/profiles/*.json"]
"share/ditserve/configs/models" = ["configs/models/*.sha256"]
